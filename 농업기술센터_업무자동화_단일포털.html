<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 외부 인터넷 호출 전면 차단 (로컬 127.0.0.1 서버만 허용) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8765; font-src 'self' data:;">
  <title>농업기술센터 로컬 업무자동화 포털</title>
  <style>
/* ==========================================================================
   농업기술센터 로컬 업무자동화 포털 - 스타일시트
   외부 폰트/CDN 일체 배제, 시스템 한글 폰트 스택 적용
   공공기관 단정 스타일, 가독성 최우선(40~60대 배려), 다크모드 및 A4 인쇄 지원
   ========================================================================== */

:root {
  --primary: #1e3a8a;          /* 신뢰의 공공 네이비 */
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --secondary: #0d9488;        /* 농업/청록 포인트 */
  --secondary-hover: #0f766e;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #d97706;
  --info: #0284c7;

  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #0f172a;       /* 사이드바 다크 네이비 */
  --bg-sidebar-hover: #1e293b;
  --bg-sidebar-active: #2563eb;
  --text-sidebar: #cbd5e1;
  --text-sidebar-bright: #ffffff;

  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;

  --border: #e2e8f0;
  --border-focus: #3b82f6;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);

  --font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
  --sidebar-width: 290px;
  --header-height: 72px;
}

[data-theme="dark"] {
  --bg-main: #0b0f19;
  --bg-card: #151d2f;
  --bg-sidebar: #0a0e1a;
  --bg-sidebar-hover: #1e293b;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-light: #64748b;
  --border: #243049;
  --primary-light: #1e293b;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
}

/* 기본 리셋 */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  font-family: var(--font-family);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text-main);
  background-color: var(--bg-main);
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 전체 앱 레이아웃 */
.app-container {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* 좌측 사이드바 */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--bg-sidebar);
  color: var(--text-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  height: 100%;
  z-index: 20;
}

.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-brand-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, #2563eb, #0d9488);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
}

.sidebar-brand-text h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-sidebar-bright);
  letter-spacing: -0.3px;
}

.sidebar-brand-text p {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 2px;
}

/* 메뉴 검색 */
.sidebar-search {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px;
  background-color: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-sm);
  color: #fff;
  font-size: 13px;
  outline: none;
  transition: all 0.2s;
}

.sidebar-search input:focus {
  background-color: rgba(255, 255, 255, 0.15);
  border-color: #3b82f6;
}

.sidebar-search input::placeholder {
  color: #64748b;
}

/* 사이드바 메뉴 네비게이션 */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}

.sidebar-nav::-webkit-scrollbar {
  width: 6px;
}
.sidebar-nav::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 3px;
}

.menu-category-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: #64748b;
  padding: 12px 10px 6px 10px;
  letter-spacing: 0.5px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-sidebar);
  font-size: 13.5px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-bottom: 2px;
  user-select: none;
}

.nav-item:hover {
  background-color: var(--bg-sidebar-hover);
  color: var(--text-sidebar-bright);
}

.nav-item.active {
  background-color: var(--bg-sidebar-active);
  color: #ffffff;
  font-weight: 600;
}

.nav-item-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item-num {
  font-size: 10px;
  background: rgba(255, 255, 255, 0.12);
  color: #94a3b8;
  padding: 1px 6px;
  border-radius: 10px;
}

/* 사이드바 푸터 */
.sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 11.5px;
  color: #64748b;
}

.sidebar-footer .secure-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #10b981;
  font-weight: 600;
  margin-bottom: 4px;
}

.secure-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background-color: #10b981;
  display: inline-block;
  box-shadow: 0 0 8px #10b981;
}

/* 메인 영역 */
.main-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-main);
}

/* 상단 헤더 */
.top-header {
  height: var(--header-height);
  background-color: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  flex-shrink: 0;
}

.header-title-area h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-title-area p {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 3px;
}

.header-security-notice {
  display: flex;
  align-items: center;
  gap: 16px;
}

.security-tag {
  background-color: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

[data-theme="dark"] .security-tag {
  background-color: #064e3b;
  border-color: #047857;
  color: #a7f3d0;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-icon {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-main);
  transition: all 0.2s;
  font-size: 16px;
}

.btn-icon:hover {
  background-color: var(--primary-light);
  border-color: var(--primary);
}

/* 메인 스크롤 콘텐츠 영역 */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 48px 28px;
}

/* 작업 카드 */
.work-card {
  background-color: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
  overflow: hidden;
}

.card-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: rgba(0, 0, 0, 0.01);
}

.card-title-group h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title-group p {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;
}

.card-body {
  padding: 24px;
}

/* 업무 단계 인디케이터 (① 파일 선택 -> ② 옵션 -> ③ 실행 -> ④ 다운로드) */
.step-tracker {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-main);
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--text-muted);
  border: 1px solid var(--border);
}

.step-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.step-item.active {
  color: var(--primary);
}

.step-num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.step-item.active .step-num {
  background: var(--primary);
  color: #fff;
}

.step-arrow {
  color: var(--text-light);
  font-size: 12px;
}

/* 파일 업로드 드롭존 */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  background-color: var(--bg-main);
  transition: all 0.2s ease;
  position: relative;
}

.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background-color: var(--primary-light);
}

.drop-zone-icon {
  font-size: 40px;
  margin-bottom: 12px;
  color: var(--primary);
}

.drop-zone-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 6px;
}

.drop-zone-sub {
  font-size: 13px;
  color: var(--text-muted);
}

.drop-zone input[type="file"] {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

/* 파일 리스트 칩 */
.file-chip-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.file-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-sm);
}

.file-chip-name {
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}

.file-chip-size {
  color: var(--text-light);
  font-size: 11px;
}

.file-chip-remove {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

/* 폼 요소 및 버튼 */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
}

.form-label .required {
  color: var(--danger);
  margin-left: 2px;
}

.form-control, .form-select {
  height: 42px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background-color: var(--bg-card);
  color: var(--text-main);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

textarea.form-control {
  height: auto;
  min-height: 90px;
  padding: 10px 12px;
}

.form-control:focus, .form-select:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.form-check {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13.5px;
  user-select: none;
}

.form-check input[type="checkbox"], .form-check input[type="radio"] {
  width: 17px;
  height: 17px;
  cursor: pointer;
  accent-color: var(--primary);
}

/* 버튼 모음 (크고 명확한 공공기관 스타일) */
.btn-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
}

.btn {
  height: 44px;
  padding: 0 20px;
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  user-select: none;
}

.btn-primary {
  background-color: var(--primary);
  color: #ffffff;
}
.btn-primary:hover {
  background-color: var(--primary-hover);
}

.btn-secondary {
  background-color: var(--secondary);
  color: #ffffff;
}
.btn-secondary:hover {
  background-color: var(--secondary-hover);
}

.btn-success {
  background-color: var(--success);
  color: #ffffff;
}
.btn-success:hover {
  background-color: #15803d;
}

.btn-outline {
  background-color: transparent;
  border-color: var(--border);
  color: var(--text-main);
}
.btn-outline:hover {
  background-color: var(--primary-light);
  border-color: var(--primary);
  color: var(--primary);
}

.btn-sm {
  height: 34px;
  padding: 0 12px;
  font-size: 13px;
}

.btn-lg {
  height: 50px;
  padding: 0 28px;
  font-size: 16px;
  border-radius: var(--radius-md);
}

/* 데이터 테이블 스타일 */
.table-meta-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
}

.badge-info { background: #e0f2fe; color: #0369a1; }
.badge-secondary { background: #f1f5f9; color: #475569; }
.badge-warning { background: #fef3c7; color: #b45309; }
.badge-success { background: #dcfce7; color: #15803d; }
.badge-danger { background: #fee2e2; color: #b91c1c; }

[data-theme="dark"] .badge-info { background: #0c4a6e; color: #bae6fd; }
[data-theme="dark"] .badge-secondary { background: #1e293b; color: #cbd5e1; }
[data-theme="dark"] .badge-warning { background: #78350f; color: #fde68a; }
[data-theme="dark"] .badge-success { background: #14532d; color: #bbf7d0; }
[data-theme="dark"] .badge-danger { background: #7f1d1d; color: #fecaca; }

.table-responsive {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  max-height: 480px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  text-align: left;
}

.data-table th {
  background-color: var(--bg-main);
  padding: 10px 14px;
  font-weight: 700;
  color: var(--text-main);
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
  white-space: nowrap;
}

.data-table td {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-main);
  white-space: nowrap;
}

.data-table tbody tr:hover {
  background-color: rgba(59, 130, 246, 0.05);
}

.text-center { text-align: center; }
.text-right { text-align: right; }
.text-muted { color: var(--text-muted); }

/* 상태 검사 테이블용 하이라이트 행 */
tr.row-missing { background-color: #fee2e2 !important; }
tr.row-duplicate { background-color: #fef3c7 !important; }
tr.row-invalid { background-color: #ede9fe !important; }

[data-theme="dark"] tr.row-missing { background-color: #450a0a !important; }
[data-theme="dark"] tr.row-duplicate { background-color: #451a03 !important; }
[data-theme="dark"] tr.row-invalid { background-color: #2e1065 !important; }

/* 토스트 알림 */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 420px;
}

.toast-item {
  padding: 12px 18px;
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: #0f172a;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  font-weight: 500;
  border-left: 5px solid var(--primary);
  animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.toast-success { border-left-color: var(--success); }
.toast-error { border-left-color: var(--danger); }
.toast-warning { border-left-color: var(--warning); }
.toast-info { border-left-color: var(--info); }

.toast-icon { font-size: 16px; font-weight: bold; }
.toast-msg { flex: 1; }
.toast-close {
  background: none;
  border: none;
  font-size: 18px;
  color: #94a3b8;
  cursor: pointer;
}

.toast-fadeout {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease;
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 글로벌 로더 */
.global-loader-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(3px);
  z-index: 99999;
  display: none;
  align-items: center;
  justify-content: center;
}

.loader-box {
  background: var(--bg-card);
  padding: 32px 40px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 400px;
}

.loader-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 18px;
}

.loader-text {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 6px;
}

.loader-sub {
  font-size: 12px;
  color: var(--text-muted);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

 * 외부 인터넷이나 CDN 없이 브라우저 오프라인 환경에서 다중 파일 압축 다운로드를 지원합니다.

class SimpleZip {
  constructor() {
    this.files = [];
  }

  /**
   * 파일 추가
   * @param {string} filename 파일명 (예: "사진_001.jpg")
   * @param {Uint8Array|ArrayBuffer|Blob|string} data 파일 내용
   */
  async addFile(filename, data) {
    let uint8;
    if (data instanceof Uint8Array) {
      uint8 = data;
    } else if (data instanceof ArrayBuffer) {
      uint8 = new Uint8Array(data);
    } else if (typeof Blob !== 'undefined' && data instanceof Blob) {
      const buffer = await data.arrayBuffer();
      uint8 = new Uint8Array(buffer);
    } else if (typeof data === 'string') {
      const encoder = new TextEncoder();
      uint8 = encoder.encode(data);
    } else {
      throw new Error('지원하지 않는 데이터 형식입니다.');
    }

    const utf8Name = new TextEncoder().encode(filename);
    const crc = SimpleZip.crc32(uint8);

    this.files.push({
      name: filename,
      rawName: utf8Name,
      data: uint8,
      crc: crc,
      size: uint8.length,
      date: new Date()
    });
  }

  /**
   * ZIP 파일 바이너리 생성 (Blob 반환)
   * @returns {Blob}
   */
  generateZipBlob() {
    let localHeadersSize = 0;
    let centralDirSize = 0;

    // 크기 계산
    for (const f of this.files) {
      localHeadersSize += 30 + f.rawName.length + f.size;
      centralDirSize += 46 + f.rawName.length;
    }

    const totalSize = localHeadersSize + centralDirSize + 22;
    const buffer = new ArrayBuffer(totalSize);
    const view = new DataView(buffer);
    const bytes = new Uint8Array(buffer);

    let offset = 0;
    const centralDirOffsets = [];

    // 1. Local File Headers & File Data
    for (const f of this.files) {
      centralDirOffsets.push(offset);

      // Signature: 0x04034b50
      view.setUint32(offset, 0x04034b50, true);
      view.setUint16(offset + 4, 20, true); // Version needed (2.0)
      view.setUint16(offset + 6, 0x0800, true); // General purpose bit flag (Bit 11 = UTF-8)
      view.setUint16(offset + 8, 0, true); // Compression method (0 = Store)
      
      const { dosTime, dosDate } = SimpleZip.getDosDateTime(f.date);
      view.setUint16(offset + 10, dosTime, true);
      view.setUint16(offset + 12, dosDate, true);
      view.setUint32(offset + 14, f.crc, true); // CRC-32
      view.setUint32(offset + 18, f.size, true); // Compressed size
      view.setUint32(offset + 22, f.size, true); // Uncompressed size
      view.setUint16(offset + 26, f.rawName.length, true); // File name length
      view.setUint16(offset + 28, 0, true); // Extra field length

      offset += 30;
      bytes.set(f.rawName, offset);
      offset += f.rawName.length;

      bytes.set(f.data, offset);
      offset += f.size;
    }

    const centralDirStartOffset = offset;

    // 2. Central Directory Headers
    for (let i = 0; i < this.files.length; i++) {
      const f = this.files[i];
      const localOffset = centralDirOffsets[i];

      // Signature: 0x02014b50
      view.setUint32(offset, 0x02014b50, true);
      view.setUint16(offset + 4, 20, true); // Version made by
      view.setUint16(offset + 6, 20, true); // Version needed
      view.setUint16(offset + 8, 0x0800, true); // Bit 11 = UTF-8
      view.setUint16(offset + 10, 0, true); // Compression method (Store)

      const { dosTime, dosDate } = SimpleZip.getDosDateTime(f.date);
      view.setUint16(offset + 12, dosTime, true);
      view.setUint16(offset + 14, dosDate, true);
      view.setUint32(offset + 16, f.crc, true);
      view.setUint32(offset + 20, f.size, true);
      view.setUint32(offset + 24, f.size, true);
      view.setUint16(offset + 28, f.rawName.length, true);
      view.setUint16(offset + 30, 0, true); // Extra field length
      view.setUint16(offset + 32, 0, true); // File comment length
      view.setUint16(offset + 34, 0, true); // Disk number start
      view.setUint16(offset + 36, 0, true); // Internal file attributes
      view.setUint32(offset + 38, 0, true); // External file attributes
      view.setUint32(offset + 42, localOffset, true); // Relative offset of local header

      offset += 46;
      bytes.set(f.rawName, offset);
      offset += f.rawName.length;
    }

    const centralDirEndOffset = offset;
    const actualCentralDirSize = centralDirEndOffset - centralDirStartOffset;

    // 3. End of Central Directory Record
    // Signature: 0x06054b50
    view.setUint32(offset, 0x06054b50, true);
    view.setUint16(offset + 4, 0, true); // Disk number
    view.setUint16(offset + 6, 0, true); // Disk number with central dir
    view.setUint16(offset + 8, this.files.length, true); // Total entries disk
    view.setUint16(offset + 10, this.files.length, true); // Total entries central
    view.setUint32(offset + 12, actualCentralDirSize, true); // Size of central dir
    view.setUint32(offset + 16, centralDirStartOffset, true); // Offset of start
    view.setUint16(offset + 20, 0, true); // Comment length

    return new Blob([buffer], { type: 'application/zip' });
  }

  // DOS Date/Time 변환
  static getDosDateTime(date) {
    const d = date || new Date();
    const year = d.getFullYear();
    const dosYear = year < 1980 ? 0 : year - 1980;
    const dosMonth = d.getMonth() + 1;
    const dosDay = d.getDate();
    const dosHours = d.getHours();
    const dosMinutes = d.getMinutes();
    const dosSeconds = Math.floor(d.getSeconds() / 2);

    const dosDate = (dosYear << 9) | (dosMonth << 5) | dosDay;
    const dosTime = (dosHours << 11) | (dosMinutes << 5) | dosSeconds;

    return { dosDate, dosTime };
  }

  // CRC-32 계산 (하드코딩 테이블로 고속 계산)
  static crc32(uint8) {
    if (!SimpleZip._crcTable) {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) {
          c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        }
        table[i] = c;
      }
      SimpleZip._crcTable = table;
    }

    let crc = 0xffffffff;
    const table = SimpleZip._crcTable;
    for (let i = 0; i < uint8.length; i++) {
      crc = table[(crc ^ uint8[i]) & 0xff] ^ (crc >>> 8);
    }
    return (crc ^ 0xffffffff) >>> 0;
  }
}

/**
 * 농업기술센터 로컬 업무자동화 포털 - 핵심 유틸리티 (CoreUtils)
 * 외부 인터넷 및 통신 일체 차단, 100% 브라우저 로컬 작동
 * 인코딩(CP949/EUC-KR/UTF-8), RFC4180 CSV, 다운로드, 개인정보 마스킹, Canvas 차트 등

const CoreUtils = {
  /**
   * RFC 4180 호환 견고한 CSV 파서
   * 따옴표 내 줄바꿈, 쉼표, 이스케이프 쌍따옴표("") 완벽 지원
   * @param {string} text CSV 텍스트
   * @param {string} [delimiter] 구분자 (미지정 시 자동 감지)
   * @returns {{ headers: string[], rows: string[][], totalRows: number }}
   */
  parseCSV(text, delimiter) {
    if (!text || !text.trim()) {
      return { headers: [], rows: [], totalRows: 0 };
    }

    // 앞부분 BOM 제거
    if (text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
    }

    // 구분자 자동 감지 (미지정 시)
    if (!delimiter) {
      const firstLine = text.split(/\r\n|\n|\r/)[0] || '';
      const commaCount = (firstLine.match(/,/g) || []).length;
      const tabCount = (firstLine.match(/\t/g) || []).length;
      const semiCount = (firstLine.match(/;/g) || []).length;

      if (tabCount > commaCount && tabCount > semiCount) delimiter = '\t';
      else if (semiCount > commaCount && semiCount > tabCount) delimiter = ';';
      else delimiter = ',';
    }

    const rows = [];
    let currentRow = [];
    let currentCell = '';
    let insideQuote = false;
    let i = 0;
    const len = text.length;

    while (i < len) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuote && nextChar === '"') {
          // 이스케이프된 쌍따옴표
          currentCell += '"';
          i += 2;
          continue;
        } else {
          // 따옴표 모드 토글
          insideQuote = !insideQuote;
          i++;
          continue;
        }
      }

      if (!insideQuote && char === delimiter) {
        currentRow.push(currentCell);
        currentCell = '';
        i++;
        continue;
      }

      if (!insideQuote && (char === '\r' || char === '\n')) {
        currentRow.push(currentCell);
        currentCell = '';
        if (currentRow.length > 0 && !(currentRow.length === 1 && currentRow[0].trim() === '')) {
          rows.push(currentRow);
        }
        currentRow = [];
        if (char === '\r' && nextChar === '\n') {
          i += 2;
        } else {
          i++;
        }
        continue;
      }

      currentCell += char;
      i++;
    }

    // 마지막 셀 및 행 처리
    if (currentCell !== '' || currentRow.length > 0) {
      currentRow.push(currentCell);
      if (currentRow.length > 0 && !(currentRow.length === 1 && currentRow[0].trim() === '')) {
        rows.push(currentRow);
      }
    }

    if (rows.length === 0) {
      return { headers: [], rows: [], totalRows: 0 };
    }

    const headers = rows[0].map(h => h.trim());
    const dataRows = rows.slice(1);

    return {
      headers: headers,
      rows: dataRows,
      totalRows: dataRows.length,
      delimiter: delimiter

   * 행 배열을 CSV 텍스트로 변환 (UTF-8 BOM 포함으로 엑셀 한글 깨짐 방지)

   * @param {string} [delimiter=','] 구분자

  toCSV(headers, rows, delimiter = ',') {
    const escapeCell = (val) => {
      if (val === null || val === undefined) return '';

      return str;

  /**

   * @param {HTMLElement} targetEl 테이블 삽입 컨테이너
   * @param {string[]} headers 컬럼명 배열
   * @param {Array<Array<any>>} rows 데이터 행 배열
   * @param {number} [maxPreview=100] 최대 미리보기 행 수
   */
  renderPreviewTable(targetEl, headers, rows, maxPreview = 100) {
    if (!targetEl) return;
    if (!headers || headers.length === 0) {
      targetEl.innerHTML = '<div class="empty-state">표시할 데이터가 없습니다.</div>';
      return;
    }

    const previewRows = rows.slice(0, maxPreview);
    const hasMore = rows.length > maxPreview;

    let html = `
      <div class="table-meta-bar">
        <span class="badge badge-info">총 <strong>${CoreUtils.formatNumber(rows.length)}</strong>개 행</span>
        <span class="badge badge-secondary">컬럼 <strong>${headers.length}</strong>개</span>
        ${hasMore ? `<span class="badge badge-warning">화면에는 상위 ${maxPreview}개 행만 표시 중 (다운로드 시 전체 적용)</span>` : ''}
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 50px;">No</th>
              ${headers.map(h => `<th>${CoreUtils.escapeHtml(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${previewRows.map((row, idx) => `
              <tr>
                <td class="text-center text-muted">${idx + 1}</td>
                ${headers.map((_, colIdx) => `<td>${CoreUtils.escapeHtml(row[colIdx] !== undefined ? String(row[colIdx]) : '')}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;

    targetEl.innerHTML = html;
  },

  /**
   * HTML 특수문자 이스케이프
   * @param {string} str
   * @returns {string}
   */
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  },

  /**
   * 순수 Canvas 가로 막대 차트 렌더러
   * 외부 라이브러리 없이 순수 HTML5 Canvas로 공공기관 스타일 차트 생성
   * @param {HTMLCanvasElement} canvas
   * @param {Array<{ label: string, value: number, color?: string }>} items
   * @param {object} [options]
   */
  drawBarChart(canvas, items, options = {}) {
    if (!canvas || !items || items.length === 0) return;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);

    const title = options.title || '';
    const unit = options.unit || '건';
    const paddingLeft = 140;
    const paddingRight = 80;
    const paddingTop = title ? 45 : 20;
    const paddingBottom = 30;

    const chartWidth = width - paddingLeft - paddingRight;
    const chartHeight = height - paddingTop - paddingBottom;

    const maxVal = Math.max(...items.map(it => it.value), 1);
    const barHeight = Math.min(32, Math.max(16, (chartHeight / items.length) * 0.65));
    const stepY = chartHeight / items.length;

    // 제목
    if (title) {
      ctx.font = 'bold 15px sans-serif';
      ctx.fillStyle = options.isDark ? '#e2e8f0' : '#1e293b';
      ctx.textAlign = 'left';
      ctx.fillText(title, 20, 25);
    }

    const defaultColors = ['#2563eb', '#3b82f6', '#0284c7', '#0d9488', '#16a34a', '#ca8a04', '#ea580c', '#e11d48'];

    items.forEach((item, idx) => {
      const y = paddingTop + idx * stepY + (stepY - barHeight) / 2;
      const barW = (item.value / maxVal) * chartWidth;
      const color = item.color || defaultColors[idx % defaultColors.length];

      // 배경 그리드 바
      ctx.fillStyle = options.isDark ? '#334155' : '#f1f5f9';
      ctx.fillRect(paddingLeft, y, chartWidth, barHeight);

      // 실제 값 바
      ctx.fillStyle = color;
      ctx.fillRect(paddingLeft, y, Math.max(3, barW), barHeight);

      // 레이블 (좌측)
      ctx.font = '13px sans-serif';
      ctx.fillStyle = options.isDark ? '#cbd5e1' : '#334155';
      ctx.textAlign = 'right';
      ctx.fillText(item.label, paddingLeft - 10, y + barHeight / 2 + 4);

      // 수치 (우측)
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = options.isDark ? '#f8fafc' : '#0f172a';
      ctx.textAlign = 'left';
      ctx.fillText(`${CoreUtils.formatNumber(item.value)} ${unit}`, paddingLeft + barW + 8, y + barHeight / 2 + 4);
    });
  }
};

        fillOptions(colPhoneSel, '연락처');
        fillOptions(colAddrSel, '주소');

        configArea.style.display = 'block';
        CoreUtils.showToast(`파일을 불러왔습니다. 총 ${CoreUtils.formatNumber(this.state.raw.totalRows)}행`, 'info');
      } catch (err) {
        CoreUtils.showToast('오류 발생: ' + err.message, 'error');
      } finally {
        CoreUtils.setLoading(false);
      }
    });

    runBtn.addEventListener('click', () => {
      if (!this.state.raw) return;

      CoreUtils.setLoading(true, '데이터를 표준화하고 있습니다...');
      setTimeout(() => {
        try {
          const nameCol = colNameSel.value;
          const phoneCol = colPhoneSel.value;
          const addrCol = colAddrSel.value;
          const sortOpt = container.querySelector('#farmer-sort-opt').value;

          const doTrim = container.querySelector('#clean-trim').checked;
          const doPhone = container.querySelector('#clean-phone').checked;
          const doGenId = container.querySelector('#clean-gen-id').checked;

          const nameIdx = this.state.raw.headers.indexOf(nameCol);
          const phoneIdx = this.state.raw.headers.indexOf(phoneCol);
          const addrIdx = this.state.raw.headers.indexOf(addrCol);

          let headers = [...this.state.raw.headers];
          if (doGenId && !headers.includes('농가고유번호')) {
            headers.unshift('농가고유번호');
          }

          let cleanedRows = this.state.raw.rows.map((row, idx) => {
            const newRow = [...row];

            if (doTrim) {
              for (let c = 0; c < newRow.length; c++) {
                if (typeof newRow[c] === 'string') newRow[c] = newRow[c].trim();
              }
            }

            if (nameIdx !== -1 && doTrim && newRow[nameIdx]) {
              newRow[nameIdx] = newRow[nameIdx].replace(/\s+/g, '');
            }

            if (phoneIdx !== -1 && doPhone && newRow[phoneIdx]) {
              newRow[phoneIdx] = CoreUtils.normalizePhone(newRow[phoneIdx]);
            }

            if (addrIdx !== -1 && doTrim && newRow[addrIdx]) {
              newRow[addrIdx] = newRow[addrIdx].replace(/\s{2,}/g, ' ');
            }

            if (doGenId) {
              const code = `F-${String(idx + 1).padStart(4, '0')}`;
              newRow.unshift(code);
            }

            return newRow;
          });

          // 정렬
          if (sortOpt === 'name_asc') {
            const effectiveNameIdx = doGenId ? nameIdx + 1 : nameIdx;
            if (effectiveNameIdx !== -1) {
              cleanedRows.sort((a, b) => (a[effectiveNameIdx] || '').localeCompare(b[effectiveNameIdx] || '', 'ko-KR'));
            }
          }

          this.state.cleaned = { headers, rows: cleanedRows };
          resultArea.style.display = 'block';
          CoreUtils.renderPreviewTable(tableContainer, headers, cleanedRows);
          CoreUtils.showToast(`정리 완료! 총 ${CoreUtils.formatNumber(cleanedRows.length)}행`, 'success');
        } catch (err) {
          CoreUtils.showToast('정리 중 오류 발생: ' + err.message, 'error');
        } finally {
          CoreUtils.setLoading(false);
        }
      }, 50);
    });

    downloadBtn.addEventListener('click', () => {
      if (!this.state.cleaned) return;
      const csvStr = CoreUtils.toCSV(this.state.cleaned.headers, this.state.cleaned.rows);
      CoreUtils.downloadFile(csvStr, '농가명단_정리완료.csv');
      CoreUtils.showToast('정리된 농가명단이 다운로드되었습니다.', 'success');
    });
  }
};

                <p>빨간색: 필수값 누락 | 주황색: 중복 데이터 | 보라색: 형식 오류</p>

  bindEvents(container) {
    const fileInput = container.querySelector('#audit-file-input');
    const configArea = container.querySelector('#audit-config-area');
    const colDup1 = container.querySelector('#audit-col-dup1');
    const colDup2 = container.querySelector('#audit-col-dup2');
    const colReq = container.querySelector('#audit-col-required');
    const runBtn = container.querySelector('#btn-run-audit');
    const resultArea = container.querySelector('#audit-result-area');
    const statsGrid = container.querySelector('#audit-stats-grid');
    const tableContainer = container.querySelector('#audit-table-container');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const { text } = await CoreUtils.readFileAsText(file);
        this.state.raw = CoreUtils.parseCSV(text);

        const buildOptions = (sel, matchKey) => {
          sel.innerHTML = this.state.raw.headers.map(h => {
            const isMatch = matchKey && h.includes(matchKey);
            return `<option value="${CoreUtils.escapeHtml(h)}" ${isMatch ? 'selected' : ''}>${CoreUtils.escapeHtml(h)}</option>`;
          }).join('');
        };

        buildOptions(colDup1, '연락처');
        buildOptions(colDup2, '');
        colDup2.insertAdjacentHTML('afterbegin', '<option value="">(단일 기준만 적용)</option>');
        buildOptions(colReq, '성명');

        configArea.style.display = 'block';
        CoreUtils.showToast(`파일 준비 완료 (${CoreUtils.formatNumber(this.state.raw.totalRows)}행)`, 'info');
      } catch (err) {
        CoreUtils.showToast('파일 읽기 오류: ' + err.message, 'error');
      }
    });

    runBtn.addEventListener('click', () => {
      if (!this.state.raw) return;

      const c1 = colDup1.value;
      const c2 = colDup2.value;
      const cReq = colReq.value;

      const idx1 = this.state.raw.headers.indexOf(c1);
      const idx2 = c2 ? this.state.raw.headers.indexOf(c2) : -1;
      const idxReq = this.state.raw.headers.indexOf(cReq);

      // 카운트 맵 구성
      const keyCount = new Map();
      this.state.raw.rows.forEach(r => {
        const v1 = (r[idx1] || '').trim();
        const v2 = idx2 !== -1 ? (r[idx2] || '').trim() : '';
        const compositeKey = v1 ? `${v1}___${v2}` : '';
        if (compositeKey) {
          keyCount.set(compositeKey, (keyCount.get(compositeKey) || 0) + 1);
        }
      });

      let normalCount = 0;
      let missingCount = 0;
      let dupCount = 0;
      let formatErrCount = 0;

      const auditedRows = this.state.raw.rows.map(row => {
        let status = '정상';
        let statusClass = '';

        const reqVal = (row[idxReq] || '').trim();
        const v1 = (row[idx1] || '').trim();
        const v2 = idx2 !== -1 ? (row[idx2] || '').trim() : '';
        const compositeKey = v1 ? `${v1}___${v2}` : '';

        // 1. 필수 누락 체크
        if (!reqVal) {
          status = '필수누락';
          statusClass = 'row-missing';
          missingCount++;
        }
        // 2. 중복 체크
        else if (compositeKey && (keyCount.get(compositeKey) || 0) > 1) {
          status = '중복데이터';
          statusClass = 'row-duplicate';
          dupCount++;
        }
        // 3. 연락처 형식 체크 (선택 컬럼이 연락처인 경우)
        else if (c1.includes('연락처') || c1.includes('전화')) {
          if (v1 && !CoreUtils.isValidPhone(v1)) {
            status = '형식오류';
            statusClass = 'row-invalid';
            formatErrCount++;
          } else {
            normalCount++;
          }
        } else {
          normalCount++;
        }

        return {
          status,
          statusClass,
          data: [status, ...row]
        };
      });

      this.state.auditRows = auditedRows;

      // 통계 카드 렌더링
      statsGrid.innerHTML = `

        </div>
        <div class="stat-card">
          <div class="stat-label">필수값 누락</div>
          <div class="stat-value" style="color: var(--danger);">${CoreUtils.formatNumber(missingCount)}<span class="stat-unit">건</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">중복 의심 건</div>
          <div class="stat-value" style="color: var(--warning);">${CoreUtils.formatNumber(dupCount)}<span class="stat-unit">건</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">형식 오류</div>
          <div class="stat-value" style="color: #7c3aed;">${CoreUtils.formatNumber(formatErrCount)}<span class="stat-unit">건</span></div>
        </div>
      `;

      // 테이블 렌더링 (커스텀 클래스 적용)
      const auditHeaders = ['검사결과', ...this.state.raw.headers];
      const previewRows = auditedRows.slice(0, 100);

      tableContainer.innerHTML = `
        <div class="table-meta-bar">
          <span class="badge badge-info">총 <strong>${CoreUtils.formatNumber(auditedRows.length)}</strong>건 검사 완료</span>
          ${auditedRows.length > 100 ? '<span class="badge badge-warning">상위 100건 표시 중</span>' : ''}
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 50px;">No</th>
                ${auditHeaders.map(h => `<th>${CoreUtils.escapeHtml(h)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${previewRows.map((item, idx) => `
                <tr class="${item.statusClass}">
                  <td class="text-center text-muted">${idx + 1}</td>
                  ${item.data.map(val => `<td>${CoreUtils.escapeHtml(val)}</td>`).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      resultArea.style.display = 'block';
      CoreUtils.showToast('데이터 검사가 완료되었습니다.', 'success');
    });

    container.querySelector('#btn-download-audit-all').addEventListener('click', () => {
      if (!this.state.auditRows.length) return;
      const headers = ['검사상태', ...this.state.raw.headers];
      const rows = this.state.auditRows.map(r => r.data);
      CoreUtils.downloadFile(CoreUtils.toCSV(headers, rows), '데이터검사_전체결과.csv');
      CoreUtils.showToast('전체 검사 결과가 다운로드되었습니다.', 'success');
    });

    container.querySelector('#btn-download-audit-errors').addEventListener('click', () => {
      if (!this.state.auditRows.length) return;
      const headers = ['검사상태', ...this.state.raw.headers];
      const errRows = this.state.auditRows.filter(r => r.status !== '정상').map(r => r.data);
      if (errRows.length === 0) {
        CoreUtils.showToast('오류나 중복 건이 없습니다! 모든 데이터가 정상입니다.', 'info');
        return;
      }
      CoreUtils.downloadFile(CoreUtils.toCSV(headers, errRows), '데이터검사_오류중복추출.csv');
      CoreUtils.showToast(`오류/중복 ${errRows.length}건이 다운로드되었습니다.`, 'success');
    });
  }
};

            max,
            min,
            posRate: posRate.toFixed(1)
          };

          `${it.posRate}%`

  bindEvents(container) {
    const fileInput = container.querySelector('#proj-app-file-input');

    const runBtn = container.querySelector('#btn-run-applicant-eval');
    const resultArea = container.querySelector('#proj-app-result-area');
    const statsGrid = container.querySelector('#proj-app-stats-grid');
    const tableContainer = container.querySelector('#proj-app-table-container');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const { text } = await CoreUtils.readFileAsText(file);
        this.state.raw = CoreUtils.parseCSV(text);
        configArea.style.display = 'block';
        CoreUtils.showToast(`신청자 파일 준비 완료 (${CoreUtils.formatNumber(this.state.raw.totalRows)}행)`, 'info');
      } catch (err) {
        CoreUtils.showToast('파일 읽기 오류: ' + err.message, 'error');
      }
    });

    runBtn.addEventListener('click', () => {
      if (!this.state.raw) return;

      const headers = this.state.raw.headers;
      const rows = this.state.raw.rows;

      const youthIdx = headers.findIndex(h => h.includes('청년'));
      const areaIdx = headers.findIndex(h => h.includes('면적'));
      const regIdx = headers.findIndex(h => h.includes('경영체'));
      const noteIdx = headers.findIndex(h => h.includes('비고') || h.includes('지원'));

      const youthPts = parseInt(container.querySelector('#rule-score-youth').value, 10);
      const areaThreshold = parseFloat(container.querySelector('#rule-score-area').value);
      const regPts = parseInt(container.querySelector('#rule-score-reg').value, 10);
      const prevPenalty = parseInt(container.querySelector('#rule-score-prev').value, 10);

      let totalYouth = 0;
      let totalOverArea = 0;

      const scoredRows = rows.map((r, i) => {
        let score = 50; // 기본점수 50점
        const scoreDetails = [];

        // 청년농 체크
        if (youthIdx !== -1 && r[youthIdx] && (r[youthIdx].includes('Y') || r[youthIdx].includes('청년') || r[youthIdx].includes('예'))) {
          score += youthPts;
          totalYouth++;
          scoreDetails.push(`청년농(+${youthPts})`);
        }

        // 재배면적 체크
        if (areaIdx !== -1 && r[areaIdx]) {
          const areaVal = CoreUtils.parseNumber(r[areaIdx]);
          if (areaVal >= areaThreshold) {
            score += 20;
            totalOverArea++;
            scoreDetails.push(`면적충족(+20)`);
          }
        }

        // 경영체 등록번호
        if (regIdx !== -1 && r[regIdx] && r[regIdx].trim().length >= 6) {
          score += regPts;
          scoreDetails.push(`경영체(+${regPts})`);
        }

        // 기존 수혜 여부 감점
        if (noteIdx !== -1 && r[noteIdx] && (r[noteIdx].includes('지원받음') || r[noteIdx].includes('기존수혜'))) {
          score += prevPenalty;
          scoreDetails.push(`수혜이력(${prevPenalty})`);
        }

        return {
          score,
          scoreDetails: scoreDetails.join(', ') || '기본배점',
          data: r
        };
      });

      // 점수 내림차순 정렬
      scoredRows.sort((a, b) => b.score - a.score);

      // 통계 카드
      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">총 신청 농가수</div>
          <div class="stat-value">${CoreUtils.formatNumber(rows.length)}<span class="stat-unit">농가</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">청년농업인 신청</div>
          <div class="stat-value" style="color: var(--primary);">${totalYouth}<span class="stat-unit">명</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">면적 기준 충족</div>
          <div class="stat-value" style="color: var(--success);">${totalOverArea}<span class="stat-unit">농가</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">최고 평가 점수</div>
          <div class="stat-value" style="color: #7c3aed;">${scoredRows[0]?.score || 0}<span class="stat-unit">점</span></div>
        </div>
      `;

      const outHeaders = ['우선순위', '평가총점', '산출내역', ...headers];
      const outRows = scoredRows.map((item, idx) => [
        idx + 1,
        item.score,
        item.scoreDetails,
        ...item.data
      ]);

      this.state.evaluatedRows = { headers: outHeaders, rows: outRows };
      CoreUtils.renderPreviewTable(tableContainer, outHeaders, outRows);
      resultArea.style.display = 'block';
      CoreUtils.showToast('우선순위 평가 및 정렬이 완료되었습니다.', 'success');
    });

    container.querySelector('#btn-download-applicants').addEventListener('click', () => {
      if (!this.state.evaluatedRows) return;
      const csv = CoreUtils.toCSV(this.state.evaluatedRows.headers, this.state.evaluatedRows.rows);
      CoreUtils.downloadFile(csv, '시범사업_신청자_우선순위결과.csv');
      CoreUtils.showToast('우선순위 결과 CSV가 다운로드되었습니다.', 'success');
    });
  }
};

        officerIdx = headers.findIndex(h => h.includes('담당') || h.includes('조사자'));

        // 필터 옵션 채우기
        const crops = new Set();
        const officers = new Set();
        rows.forEach(r => {
          if (cropIdx !== -1 && r[cropIdx]) crops.add(r[cropIdx].trim());
          if (officerIdx !== -1 && r[officerIdx]) officers.add(r[officerIdx].trim());
        });

        cropSel.innerHTML = '<option value="">전체 품목</option>' +
          Array.from(crops).map(c => `<option value="${CoreUtils.escapeHtml(c)}">${CoreUtils.escapeHtml(c)}</option>`).join('');

        officerSel.innerHTML = '<option value="">전체 담당자</option>' +
          Array.from(officers).map(o => `<option value="${CoreUtils.escapeHtml(o)}">${CoreUtils.escapeHtml(o)}</option>`).join('');

        filterArea.style.display = 'block';
        this.state.filteredRows = rows;
        CoreUtils.renderPreviewTable(tableContainer, headers, rows);
        CoreUtils.showToast(`현장조사 데이터 ${rows.length}건 로드 완료!`, 'info');
      } catch (err) {
        CoreUtils.showToast('파일 읽기 오류: ' + err.message, 'error');
      }
    });

    const doFilter = () => {
      if (!this.state.raw) return;
      const targetCrop = cropSel.value;
      const targetOfficer = officerSel.value;
      const kw = searchKw.value.trim().toLowerCase();

      const filtered = this.state.raw.rows.filter(r => {
        if (targetCrop && cropIdx !== -1 && (r[cropIdx] || '').trim() !== targetCrop) return false;
        if (targetOfficer && officerIdx !== -1 && (r[officerIdx] || '').trim() !== targetOfficer) return false;
        if (kw) {
          const rowText = r.join(' ').toLowerCase();
          if (!rowText.includes(kw)) return false;
        }
        return true;
      });

      this.state.filteredRows = filtered;
      CoreUtils.renderPreviewTable(tableContainer, this.state.raw.headers, filtered);
      CoreUtils.showToast(`필터링 결과: 총 ${filtered.length}건`, 'success');
    };

    applyBtn.addEventListener('click', doFilter);
    resetBtn.addEventListener('click', () => {
      cropSel.value = '';
      officerSel.value = '';
      searchKw.value = '';
      doFilter();
    });

    downloadBtn.addEventListener('click', () => {
      if (!this.state.filteredRows || !this.state.raw) return;
      const csv = CoreUtils.toCSV(this.state.raw.headers, this.state.filteredRows);
      CoreUtils.downloadFile(csv, '현장조사_정리결과.csv');
      CoreUtils.showToast('조사 데이터가 다운로드되었습니다.', 'success');
    });
  }
};

    const tableContainer = container.querySelector('#photo-table-container');
    const exampleEl = container.querySelector('#photo-preview-example');

    taskSelect.addEventListener('change', () => {
      customTaskInput.style.display = taskSelect.value === '직접입력' ? 'block' : 'none';
      updatePreview();
    });

    const getTaskValue = () => {
      return taskSelect.value === '직접입력' ? (customTaskInput.value.trim() || '현장') : taskSelect.value;
    };

    const updatePreview = () => {
      const date = container.querySelector('#rule-photo-date').value.trim() || '20260929';
      const crop = container.querySelector('#rule-photo-crop').value.trim() || '작목';
      const task = getTaskValue();

      exampleEl.textContent = `생성 파일명 예시: ${date}_${crop}_${task}_${farmer}_001.jpg`;

      if (this.state.files.length > 0) {
        renderTable();
      }
    };

    const renderTable = () => {
      const date = container.querySelector('#rule-photo-date').value.trim() || '20260929';
      const crop = container.querySelector('#rule-photo-crop').value.trim() || '작목';
      const task = getTaskValue();
      const farmer = container.querySelector('#rule-photo-farmer').value.trim() || '농가명';

      const rows = this.state.files.map((f, i) => {
        const ext = f.name.split('.').pop() || 'jpg';
        const newName = `${date}_${crop}_${task}_${farmer}_${String(i + 1).padStart(3, '0')}.${ext}`;
        return [f.name, newName, `${(f.size / 1024).toFixed(1)} KB`];
      });

      CoreUtils.renderPreviewTable(tableContainer, ['원본 파일명', '새로 변경될 파일명', '크기'], rows);
    };

    fileInput.addEventListener('change', (e) => {
      const selected = Array.from(e.target.files);
      if (selected.length === 0) return;
      this.state.files = selected;

      fileListEl.innerHTML = selected.map(f => `
        <div class="file-chip">
          <span class="file-chip-name">🖼️ ${CoreUtils.escapeHtml(f.name)}</span>
          <span class="file-chip-size">${(f.size / 1024).toFixed(0)}KB</span>
        </div>
      `).join('');

      renderTable();
      CoreUtils.showToast(`사진 ${selected.length}장이 추가되었습니다.`, 'success');

    ['#rule-photo-date', '#rule-photo-crop', '#rule-photo-farmer', '#rule-photo-custom-task'].forEach(sel => {
      container.querySelector(sel).addEventListener('input', updatePreview);
    });

    runZipBtn.addEventListener('click', async () => {
      if (this.state.files.length === 0) {
        CoreUtils.showToast('먼저 변경할 사진 파일들을 선택해주세요.', 'warning');

      try {
        const date = container.querySelector('#rule-photo-date').value.trim() || '20260929';
        const crop = container.querySelector('#rule-photo-crop').value.trim() || '작목';
        const task = getTaskValue();
        const farmer = container.querySelector('#rule-photo-farmer').value.trim() || '농가명';

        const zip = new window.SimpleZip();

        for (let i = 0; i < this.state.files.length; i++) {
          const file = this.state.files[i];
          const ext = file.name.split('.').pop() || 'jpg';
          const newName = `${date}_${crop}_${task}_${farmer}_${String(i + 1).padStart(3, '0')}.${ext}`;
          await zip.addFile(newName, file);
        }

        const zipBlob = zip.generateZipBlob();
        CoreUtils.downloadFile(zipBlob, `사진일괄정리_${date}_${crop}_${this.state.files.length}장.zip`, 'application/zip');

  title: '사진 분류',
  subtitle: '사업전/사업후/교육/병해충/시설 등 행정 목적별로 사진을 그룹 분류하여 다운로드합니다.',
  category: '파일·사진 도구',

  state: { files: [] },

  render(container) {
    container.innerHTML = `
      <div class="work-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>🗂️ 업무 목적별 사진 일괄 분류</h3>
            <p>보조사업 정산용(사업전/사업후), 교육행사, 시설점검 등 원하는 분류 태그를 파일명 앞에 일괄 부착합니다.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="drop-zone">
            <div class="drop-zone-icon">📷</div>
            <div class="drop-zone-title">분류할 사진 파일들을 선택하세요</div>
            <input type="file" id="classify-file-input" multiple accept="image/*" />
          </div>

          <div style="margin-top: 24px;">
            <label class="form-label" style="font-size: 15px;">부여할 분류 카테고리 선택</label>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;" id="classify-tag-group">
              <button type="button" class="btn btn-outline classify-tag-btn active" data-tag="사업전">【사업전】</button>
              <button type="button" class="btn btn-outline classify-tag-btn" data-tag="사업후">【사업후】</button>
              <button type="button" class="btn btn-outline classify-tag-btn" data-tag="교육행사">【교육행사】</button>
              <button type="button" class="btn btn-outline classify-tag-btn" data-tag="현장지도">【현장지도】</button>
              <button type="button" class="btn btn-outline classify-tag-btn" data-tag="병해충">【병해충】</button>
              <button type="button" class="btn btn-outline classify-tag-btn" data-tag="시설농기계">【시설농기계】</button>
            </div>
            <div style="margin-top: 12px; max-width: 320px;">
              <input type="text" class="form-control" id="classify-custom-tag" placeholder="직접 분류명 입력 시 여기에 작성">
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-primary btn-lg" id="btn-run-classify-zip">
              <span>📦</span> 선택한 분류명 적용하여 ZIP 다운로드
            </button>
          </div>

          <div id="classify-table-container" style="margin-top: 24px;"></div>
        </div>
      </div>
    `;

    this.bindEvents(container);
  },

  bindEvents(container) {
    const fileInput = container.querySelector('#classify-file-input');
    const tagBtns = container.querySelectorAll('.classify-tag-btn');
    const customTagInput = container.querySelector('#classify-custom-tag');
    const runZipBtn = container.querySelector('#btn-run-classify-zip');
    const tableContainer = container.querySelector('#classify-table-container');

    let currentTag = '사업전';

    tagBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tagBtns.forEach(b => b.classList.remove('active', 'btn-primary'));
        btn.classList.add('active', 'btn-primary');
        currentTag = btn.getAttribute('data-tag');
        customTagInput.value = '';
        renderTable();
      });
    });

    customTagInput.addEventListener('input', () => {
      if (customTagInput.value.trim()) {
        tagBtns.forEach(b => b.classList.remove('active', 'btn-primary'));
        currentTag = customTagInput.value.trim();
        renderTable();
      }
    });

    const renderTable = () => {
      if (this.state.files.length === 0) return;
      const rows = this.state.files.map(f => [
        f.name,
        `[${currentTag}]_${f.name}`,
        `${(f.size / 1024).toFixed(1)} KB`
      ]);
      CoreUtils.renderPreviewTable(tableContainer, ['원본 파일명', '분류 적용 파일명', '크기'], rows);
    };

    fileInput.addEventListener('change', (e) => {
      this.state.files = Array.from(e.target.files);
      renderTable();
      CoreUtils.showToast(`사진 ${this.state.files.length}장이 선택되었습니다.`, 'success');
    });

    runZipBtn.addEventListener('click', async () => {
      if (this.state.files.length === 0) {
        CoreUtils.showToast('사진 파일을 먼저 선택해주세요.', 'warning');
        return;
      }

      CoreUtils.setLoading(true, '분류 태그를 적용하여 압축하고 있습니다...');
      try {
        const zip = new window.SimpleZip();
        for (const file of this.state.files) {
          const newName = `[${currentTag}]_${file.name}`;
          await zip.addFile(newName, file);
        }
        const blob = zip.generateZipBlob();
        CoreUtils.downloadFile(blob, `사진분류_${currentTag}_${this.state.files.length}장.zip`, 'application/zip');
        CoreUtils.showToast(`[${currentTag}] 분류 사진 압축 다운로드 완료!`, 'success');
      } catch (err) {
        CoreUtils.showToast('오류 발생: ' + err.message, 'error');
      } finally {
        CoreUtils.setLoading(false);
      }
    });
  }
};

/* ==========================================================================

PortalModules['batch-rename'] = {
  id: 'batch-rename',
  title: '파일 일괄 이름 변경',
  subtitle: '여러 파일에 접두어/접미어 추가, 문자열 치환, 연번 부여 후 ZIP으로 한 번에 내려받습니다.',
  category: '파일·사진 도구',

  state: { files: [] },

  render(container) {
    container.innerHTML = `
      <div class="work-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>✏️ 일반 파일 일괄 이름 변경 (Batch Renamer)</h3>
            <p>공문서, 보고서, 사진, 도면 등 여러 파일의 이름을 규칙에 따라 일괄 변환합니다.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="drop-zone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-title">이름을 변경할 파일들을 다중 선택하세요</div>
            <input type="file" id="batch-file-input" multiple />
          </div>

          <div style="margin-top: 24px; background: var(--bg-main); padding: 18px; border-radius: var(--radius-sm); border: 1px solid var(--border);">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">맨 앞에 추가 (접두어)</label>
                <input type="text" class="form-control" id="rename-prefix" placeholder="예: [농업기술센터]_">
              </div>
              <div class="form-group">
                <label class="form-label">맨 뒤에 추가 (접미어)</label>
                <input type="text" class="form-control" id="rename-suffix" placeholder="예: _최종본">
              </div>
              <div class="form-group">
                <label class="form-label">찾을 문자열 (삭제/치환)</label>
                <input type="text" class="form-control" id="rename-find" placeholder="예: (1), 복사본">
              </div>
              <div class="form-group">
                <label class="form-label">바꿀 문자열</label>
                <input type="text" class="form-control" id="rename-replace" placeholder="공란 시 삭제됨">
              </div>
            </div>

            <div style="display: flex; gap: 20px; margin-top: 10px;">
              <label class="form-check">
                <input type="checkbox" id="rename-add-seq">
                <span>파일 끝에 연번 붙이기 (_001, _002...)</span>
              </label>
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-primary btn-lg" id="btn-run-batch-rename">
              <span>📦</span> 변경된 이름으로 ZIP 일괄 다운로드
            </button>
          </div>

          <div id="batch-rename-table-container" style="margin-top: 24px;"></div>
        </div>
      </div>
    `;

    this.bindEvents(container);
  },

  bindEvents(container) {
    const fileInput = container.querySelector('#batch-file-input');
    const prefixInput = container.querySelector('#rename-prefix');
    const suffixInput = container.querySelector('#rename-suffix');
    const findInput = container.querySelector('#rename-find');
    const replaceInput = container.querySelector('#rename-replace');
    const seqCheck = container.querySelector('#rename-add-seq');
    const runBtn = container.querySelector('#btn-run-batch-rename');
    const tableContainer = container.querySelector('#batch-rename-table-container');

    const computeNewNames = () => {
      const prefix = prefixInput.value;
      const suffix = suffixInput.value;
      const findStr = findInput.value;
      const repStr = replaceInput.value;
      const useSeq = seqCheck.checked;

      return this.state.files.map((f, i) => {
        const lastDot = f.name.lastIndexOf('.');
        let baseName = lastDot !== -1 ? f.name.slice(0, lastDot) : f.name;
        const ext = lastDot !== -1 ? f.name.slice(lastDot) : '';

        if (findStr) {
          baseName = baseName.replaceAll(findStr, repStr);
        }

        let newName = prefix + baseName + suffix;
        if (useSeq) {
          newName += `_${String(i + 1).padStart(3, '0')}`;
        }
        newName += ext;

        return { original: f, newName };
      });
    };

    const renderTable = () => {
      if (this.state.files.length === 0) return;
      const list = computeNewNames();
      const rows = list.map(item => [item.original.name, item.newName]);
      CoreUtils.renderPreviewTable(tableContainer, ['원본 파일명', '새 파일명'], rows);
    };

    fileInput.addEventListener('change', (e) => {
      this.state.files = Array.from(e.target.files);
      renderTable();
      CoreUtils.showToast(`파일 ${this.state.files.length}개가 선택되었습니다.`, 'info');
    });

    [prefixInput, suffixInput, findInput, replaceInput, seqCheck].forEach(el => {
      el.addEventListener('input', renderTable);
    });

    runBtn.addEventListener('click', async () => {
      if (this.state.files.length === 0) {
        CoreUtils.showToast('파일을 먼저 선택해주세요.', 'warning');
        return;
      }

      CoreUtils.setLoading(true, '파일들을 압축하고 있습니다...');
      try {
        const list = computeNewNames();
        const zip = new window.SimpleZip();
        for (const item of list) {
          await zip.addFile(item.newName, item.original);
        }
        const blob = zip.generateZipBlob();
        CoreUtils.downloadFile(blob, `파일명변경_${this.state.files.length}개.zip`, 'application/zip');
        CoreUtils.showToast('이름 변경 ZIP 다운로드 완료!', 'success');
      } catch (err) {
        CoreUtils.showToast('압축 오류: ' + err.message, 'error');
      } finally {
        CoreUtils.setLoading(false);
      }
    });
  }
};

/* ==========================================================================

PortalModules['folder-inventory'] = {
  id: 'folder-inventory',
  title: '폴더 파일목록 생성',
  subtitle: '지정한 폴더 내부의 모든 파일명, 확장자, 크기, 수정일 목록을 추출하여 엑셀/CSV로 생성합니다.',
  category: '파일·사진 도구',

  state: { inventory: [] },

  render(container) {
    container.innerHTML = `
      <div class="work-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>📁 폴더 파일 목록 대장 생성기</h3>
            <p>폴더째 선택하여 내부 파일들의 명칭, 확장자, 크기(KB/MB), 수정일시를 일괄 조사하여 엑셀(CSV) 대장을 만듭니다.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="drop-zone" id="folder-drop-zone">
            <div class="drop-zone-icon">📂</div>
            <div class="drop-zone-title">조사할 폴더를 선택하거나 파일들을 선택하세요</div>
            <div class="drop-zone-sub">(Edge/Chrome 환경에서는 폴더를 직접 통째로 선택할 수 있습니다)</div>
            <input type="file" id="folder-file-input" webkitdirectory directory multiple />
          </div>

          <div id="folder-result-area" style="margin-top: 24px; display: none;">
            <div class="stats-grid" id="folder-stats-grid"></div>

            <div class="card-header" style="background: none; padding-left: 0; padding-right: 0;">
              <div class="card-title-group">
                <h3>폴더 파일 인벤토리 목록</h3>
              </div>
              <button class="btn btn-success" id="btn-download-folder-csv">
                <span>💾</span> 파일목록 대장 CSV 다운로드
              </button>
            </div>

            <div id="folder-table-container"></div>
          </div>
        </div>
      </div>
    `;

    this.bindEvents(container);
  },

  bindEvents(container) {
    const fileInput = container.querySelector('#folder-file-input');
    const resultArea = container.querySelector('#folder-result-area');
    const statsGrid = container.querySelector('#folder-stats-grid');
    const tableContainer = container.querySelector('#folder-table-container');
    const downloadBtn = container.querySelector('#btn-download-folder-csv');

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      CoreUtils.setLoading(true, '파일 목록을 정리하고 있습니다...');
      setTimeout(() => {
        let totalBytes = 0;
        const extMap = new Map();

        const inventory = files.map((f, i) => {
          totalBytes += f.size;
          const ext = f.name.includes('.') ? f.name.split('.').pop().toLowerCase() : '확장자없음';
          extMap.set(ext, (extMap.get(ext) || 0) + 1);

          const dateStr = f.lastModified ? new Date(f.lastModified).toISOString().slice(0, 19).replace('T', ' ') : '';
          const sizeKb = (f.size / 1024).toFixed(1);
          const relPath = f.webkitRelativePath || f.name;

          return [i + 1, f.name, ext, `${sizeKb} KB`, f.size, dateStr, relPath];
        });

        this.state.inventory = inventory;

        const totalMb = (totalBytes / (1024 * 1024)).toFixed(1);

        statsGrid.innerHTML = `
          <div class="stat-card">
            <div class="stat-label">총 파일 개수</div>
            <div class="stat-value">${CoreUtils.formatNumber(files.length)}<span class="stat-unit">개</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">총 파일 용량</div>
            <div class="stat-value" style="color: var(--primary);">${totalMb}<span class="stat-unit">MB</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">확장자 종류</div>
            <div class="stat-value" style="color: var(--success);">${extMap.size}<span class="stat-unit">종</span></div>
          </div>
        `;

        const headers = ['연번', '파일명', '확장자', '파일크기', '바이트수', '최종수정일', '상대경로'];
        CoreUtils.renderPreviewTable(tableContainer, headers, inventory);
        resultArea.style.display = 'block';
        CoreUtils.setLoading(false);
        CoreUtils.showToast(`총 ${files.length}개 파일 목록 추출 완료!`, 'success');
      }, 50);
    });

    downloadBtn.addEventListener('click', () => {
      if (this.state.inventory.length === 0) return;
      const headers = ['연번', '파일명', '확장자', '파일크기', '바이트수', '최종수정일', '상대경로'];
      const csv = CoreUtils.toCSV(headers, this.state.inventory);
      CoreUtils.downloadFile(csv, '폴더파일목록_대장.csv');
      CoreUtils.showToast('파일목록 대장이 다운로드되었습니다.', 'success');
    });
  }
};

/* ==========================================================================
   15. CSV 변환
   ========================================================================== */
PortalModules['csv-convert'] = {
  id: 'csv-convert',
  title: 'CSV 변환',
  subtitle: '탭(TSV)·세미콜론 구분자 변환, UTF-8 BOM 변환, 특정 컬럼 추출 및 순서 변경을 지원합니다.',
  category: '파일·사진 도구',

  state: { raw: null, selectedCols: [] },

  render(container) {
    container.innerHTML = `
      <div class="work-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>🔄 CSV 및 텍스트 데이터 형식 변환</h3>
            <p>탭 구분 TXT, 세미콜론(;) 파일 변환, 엑셀용 UTF-8 BOM 인코딩 변환, 필요한 컬럼만 추출합니다.</p>
          </div>
        </div>
        <div class="card-body">
          <div class="drop-zone">
            <div class="drop-zone-icon">⇄</div>
            <div class="drop-zone-title">변환할 CSV 또는 텍스트(.txt) 파일을 선택하세요</div>
            <input type="file" id="convert-file-input" accept=".csv,.txt,.tsv" />
          </div>

          <div id="convert-config-area" style="margin-top: 24px; display: none;">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">내보낼 구분자</label>
                <select class="form-select" id="convert-out-delimiter">
                  <option value="," selected>쉼표 (표준 CSV)</option>
                  <option value="\\t">탭 (Tab, TSV/메모장용)</option>
                  <option value=";">세미콜론 (;)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">엑셀 호환 UTF-8 BOM</label>
                <div style="margin-top: 10px;">
                  <label class="form-check">
                    <input type="checkbox" id="convert-use-bom" checked>
                    <span>UTF-8 BOM 포함 (Excel에서 한글 깨짐 방지)</span>
                  </label>
                </div>
              </div>
            </div>

            <div style="margin-top: 16px;">
              <label class="form-label">추출할 컬럼 선택 (체크 해제 시 해당 컬럼 제외)</label>
              <div id="convert-col-checkboxes" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; background: var(--bg-main); padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);"></div>
            </div>

            <div class="btn-group">
              <button class="btn btn-primary btn-lg" id="btn-run-convert">
                <span>💾</span> 변환된 파일 다운로드
              </button>
            </div>

            <div id="convert-table-container" style="margin-top: 24px;"></div>
          </div>
        </div>
      </div>
    `;

    this.bindEvents(container);
  },

  bindEvents(container) {
    const fileInput = container.querySelector('#convert-file-input');
    const configArea = container.querySelector('#convert-config-area');
    const colBoxesContainer = container.querySelector('#convert-col-checkboxes');
    const runBtn = container.querySelector('#btn-run-convert');
    const tableContainer = container.querySelector('#convert-table-container');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const { text } = await CoreUtils.readFileAsText(file);
        this.state.raw = CoreUtils.parseCSV(text);
        const headers = this.state.raw.headers;

        colBoxesContainer.innerHTML = headers.map((h, i) => `
          <label class="form-check">
            <input type="checkbox" class="convert-col-check" value="${i}" checked>
            <span>${CoreUtils.escapeHtml(h)}</span>
          </label>
        `).join('');

        configArea.style.display = 'block';
        CoreUtils.renderPreviewTable(tableContainer, headers, this.state.raw.rows);
        CoreUtils.showToast(`파일 분석 완료 (${headers.length}개 컬럼)`, 'info');
      } catch (err) {
        CoreUtils.showToast('파일 읽기 오류: ' + err.message, 'error');
      }
    });

    runBtn.addEventListener('click', () => {
      if (!this.state.raw) return;

      const checkedIndices = Array.from(container.querySelectorAll('.convert-col-check:checked')).map(el => parseInt(el.value, 10));
      if (checkedIndices.length === 0) {
        CoreUtils.showToast('최소 하나 이상의 컬럼을 선택해주세요.', 'warning');
        return;
      }

      const delimVal = container.querySelector('#convert-out-delimiter').value;
      const delimiter = delimVal === '\\t' ? '\t' : delimVal;
      const useBom = container.querySelector('#convert-use-bom').checked;

      const outHeaders = checkedIndices.map(i => this.state.raw.headers[i]);
      const outRows = this.state.raw.rows.map(r => checkedIndices.map(i => r[i] || ''));

      let csvStr = CoreUtils.toCSV(outHeaders, outRows, delimiter);
      if (!useBom && csvStr.charCodeAt(0) === 0xFEFF) {
        csvStr = csvStr.slice(1);
      }

      const ext = delimiter === '\t' ? 'tsv' : 'csv';

  bindEvents(container) {
    const fileInput = container.querySelector('#town-stat-file');
    const resultArea = container.querySelector('#town-stat-result');
    const tableContainer = container.querySelector('#town-stat-table');
    const canvas = container.querySelector('#town-chart');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const { text } = await CoreUtils.readFileAsText(file);
        this.state.raw = CoreUtils.parseCSV(text);
        const headers = this.state.raw.headers;
        const rows = this.state.raw.rows;

        const townIdx = headers.findIndex(h => h.includes('읍면') || h.includes('소속') || h.includes('지역'));
        const valIdx = headers.findIndex(h => h.includes('사업비') || h.includes('면적'));

        if (townIdx === -1) {
          CoreUtils.showToast('읍·면 행정구역 컬럼을 찾을 수 없습니다.', 'warning');
          return;
        }

        const map = new Map();
        rows.forEach(r => {
          const town = (r[townIdx] || '').trim();
          if (!town) return;
          const val = valIdx !== -1 ? CoreUtils.parseNumber(r[valIdx]) : 1;

          if (!map.has(town)) {
            map.set(town, { count: 0, sum: 0 });
          }
          const item = map.get(town);
          item.count++;
          item.sum += val;
        });

        const sorted = Array.from(map.entries()).sort((a, b) => b[1].count - a[1].count);
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        const chartItems = sorted.slice(0, 10).map(([k, v]) => ({ label: k, value: v.count }));
        CoreUtils.drawBarChart(canvas, chartItems, { unit: '건', isDark, title: '읍·면별 총 등록/참여 건수' });

        const valName = valIdx !== -1 ? headers[valIdx] : '건수';
        const outHeaders = ['연번', '읍·면명', '등록/참여 농가수', `${valName} 합계`];
        const outRows = sorted.map(([k, v], idx) => [
          idx + 1,
          k,
          `${CoreUtils.formatNumber(v.count)}건`,
          CoreUtils.formatNumber(v.sum)
        ]);

        this.state.stats = { headers: outHeaders, rows: outRows };
        CoreUtils.renderPreviewTable(tableContainer, outHeaders, outRows);
        resultArea.style.display = 'block';
        CoreUtils.showToast(`읍·면 ${sorted.length}곳 분석 완료!`, 'success');
      } catch (err) {
        CoreUtils.showToast('오류 발생: ' + err.message, 'error');
      }
    });

    container.querySelector('#btn-download-town-csv').addEventListener('click', () => {
      if (!this.state.stats) return;
      const csv = CoreUtils.toCSV(this.state.stats.headers, this.state.stats.rows);
      CoreUtils.downloadFile(csv, '읍면별_농업행정통계.csv');
      CoreUtils.showToast('읍면별 통계가 다운로드되었습니다.', 'success');
    });
  }

  bindEvents(container) {

    const configArea = container.querySelector('#period-stat-config');

    const unitSel = container.querySelector('#period-group-unit');
    const valSel = container.querySelector('#period-col-val');
    const runBtn = container.querySelector('#btn-run-period');
    const resultArea = container.querySelector('#period-stat-result');
    const tableContainer = container.querySelector('#period-stat-table');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const { text } = await CoreUtils.readFileAsText(file);
        this.state.raw = CoreUtils.parseCSV(text);
        const headers = this.state.raw.headers;

        dateSel.innerHTML = headers.map(h => `
          <option value="${CoreUtils.escapeHtml(h)}" ${h.includes('일') || h.includes('날짜') || h.includes('연도') ? 'selected' : ''}>${CoreUtils.escapeHtml(h)}</option>
        `).join('');

        valSel.innerHTML = '<option value="">(건수만 집계)</option>' +
          headers.map(h => `<option value="${CoreUtils.escapeHtml(h)}">${CoreUtils.escapeHtml(h)}</option>`).join('');

        CoreUtils.showToast(`파일 분석 완료 (${this.state.raw.totalRows}행)`, 'info');

        CoreUtils.showToast('파일 읽기 오류: ' + err.message, 'error');
      }
    });

    runBtn.addEventListener('click', () => {
      if (!this.state.raw) return;

      const dateCol = dateSel.value;
      const unit = unitSel.value;
      const valCol = valSel.value;

      const dIdx = this.state.raw.headers.indexOf(dateCol);
      const vIdx = valCol ? this.state.raw.headers.indexOf(valCol) : -1;

      const periodMap = new Map();

      this.state.raw.rows.forEach(r => {
        const rawDate = (r[dIdx] || '').trim();
        const normDate = CoreUtils.normalizeDate(rawDate);
        if (!normDate || normDate.length < 7) return;

        const year = normDate.slice(0, 4);
        const month = parseInt(normDate.slice(5, 7), 10);
        let periodKey = '';

        if (unit === 'month') {
          periodKey = `${year}년 ${month}월`;
        } else if (unit === 'quarter') {
          const q = Math.ceil(month / 3);
          periodKey = `${year}년 ${q}분기`;
        } else {
          const h = month <= 6 ? '상반기' : '하반기';
          periodKey = `${year}년 ${h}`;
        }

        const val = vIdx !== -1 ? CoreUtils.parseNumber(r[vIdx]) : 0;
        if (!periodMap.has(periodKey)) {
          periodMap.set(periodKey, { count: 0, sum: 0 });
        }
        const item = periodMap.get(periodKey);
        item.count++;
        item.sum += val;
      });

      const sorted = Array.from(periodMap.entries()).sort((a, b) => a[0].localeCompare(b[0]));
      const outHeaders = ['구분 기간', '건수', ...(valCol ? [`${valCol} 합계`] : [])];
      const outRows = sorted.map(([k, v]) => [
        k,
        `${v.count}건`,
        ...(valCol ? [CoreUtils.formatNumber(v.sum)] : [])
      ]);

      this.state.periodRows = { headers: outHeaders, rows: outRows };
      CoreUtils.renderPreviewTable(tableContainer, outHeaders, outRows);
      resultArea.style.display = 'block';
      CoreUtils.showToast('기간별 실적 집계 완료!', 'success');

      CoreUtils.downloadFile(csv, '기간별_실적피벗집계.csv');
      CoreUtils.showToast('집계 결과가 다운로드되었습니다.', 'success');
    });
  }
};

    const addBtn = container.querySelector('#btn-add-chk-item');

      const items = this.state.templates[tplKey] || [];
      const saved = JSON.parse(localStorage.getItem(`portal_chk_${tplKey}`) || '[]');

      itemsList.innerHTML = items.map((item, idx) => {
        const isChecked = saved.includes(idx) ? 'checked' : '';
        return `
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border);">

PortalModules['data-compare'] = {
  id: 'data-compare',
  title: '데이터 비교',
  subtitle: '두 개의 CSV 파일을 비교하여 신규 추가, 삭제, 변경, 동일 행을 정밀 추적합니다.',
  category: '보고서·데이터 가공',

  state: { fileA: null, fileB: null, diffRows: [] },

  render(container) {
    container.innerHTML = `
      <div class="work-card">
        <div class="card-header">
          <div class="card-title-group">
            <h3>⚖️ 두 CSV 데이터 차이점(Diff) 비교</h3>
            <p>작년 명단 vs 올해 명단, 또는 수정 전후 CSV를 비교하여 신규자, 탈락자, 변경 정보를 찾아냅니다.</p>
          </div>
